plugins { id 'com.android.application' }
android {
    namespace 'com.forddrive.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.forddrive.launcher'
        minSdk 23
        targetSdk 28
        versionCode 7
        versionName '7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
